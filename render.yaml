services:
  # Backend API Service
  - type: web
    name: autocover-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REFERENCE_DATE
        value: 2026-11-10
      - key: DATABASE_URL
        value: sqlite:///./autocover.db

  # Frontend Static Site
  - type: web
    name: autocover-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
